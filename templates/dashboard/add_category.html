{% extends "base.html" %}

{% block content %}

{% include "dashboard/sidebar.html" %}

{% load crispy_forms_tags %}

<div class="container py-4 dashboard-form-shell">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">

            <!-- Card -->
            <div class="card dashboard-form-card">

                <!-- Header -->
                <div class="card-header dashboard-form-heading">
                    <h2 class="mb-1 fw-bold">
                        Add Category
                    </h2>
                    <p class="mb-0 opacity-75">
                        Create a category for your blog posts.
                    </p>
                </div>

                <!-- Form -->
                <div class="card-body p-4 p-md-5">

                    <form class="dashboard-category-form" action="{% url 'add_category' %}" method="POST">
                        {% csrf_token %}

                        <div class="dashboard-form-fields">
                            {{ form|crispy }}
                        </div>

                        <div class="dashboard-form-actions">
                            <a class="dashboard-form-cancel" href="{% url 'categories' %}">Cancel</a>
                            <button type="submit" class="btn btn-primary">Add Category</button>
                        </div>

                    </form>

                </div>

            </div>

        </div>
    </div>
</div>

{% endblock %}
