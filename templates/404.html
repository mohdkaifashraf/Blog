{% extends "base.html" %}

{% block content %}
<main class="not-found-page" aria-labelledby="not-found-title">
    <div class="not-found-copy">
        <p class="not-found-eyebrow">404 / PAGE NOT FOUND</p>
        <h1 id="not-found-title">This page can't be found.</h1>
        <p class="not-found-description">
            The address may be incorrect, or the page may have moved. Head back to the blog to find what you need.
        </p>
        <a class="btn btn-warning not-found-home" href="{% url 'home' %}">Return to the homepage</a>
    </div>
    <div class="not-found-mark" aria-hidden="true">
        <span class="not-found-code">404</span>
        <span class="not-found-caption">NOT HERE<br>KEEP READING</span>
    </div>
</main>
{% endblock %}
